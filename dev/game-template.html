function menuPress(k) {
  if (mode === 'train' || mode === 'tevent') return trainPress(k);
  if (mode === 'village') return villagePress(k);
  if (mode === 'title') {
    if (k === 'up') { titleIdx = (titleIdx + 3) % 4; sfx('move'); }
    else if (k === 'down') { titleIdx = (titleIdx + 1) % 4; sfx('move'); }
    else if (k === 'ok') {
      const it = TITLE_ITEMS[titleIdx];
      if (it === 'CONTINUE') { if (!anySave()) { sfx('bad'); return true; } slotPurpose = 'continue'; slotIdx = [0, 1, 2].find(i => readSlot(i)); slotConfirm = false; mode = 'slots'; sfx('ok'); }
      else if (it === 'NEW GAME') { slotPurpose = 'new'; slotIdx = 0; slotConfirm = false; mode = 'slots'; sfx('ok'); }
      else if (it === 'OPTIONS') { optIdx = 0; mode = 'options'; sfx('ok'); }
      else { mode = 'credits'; sfx('ok'); }
    }
    return true;
  }
  if (mode === 'slots') {
    if (k === 'left') { slotIdx = (slotIdx + 2) % 3; slotConfirm = false; sfx('move'); }
    else if (k === 'right') { slotIdx = (slotIdx + 1) % 3; slotConfirm = false; sfx('move'); }
    else if (k === 'back') { sfx('move'); if (slotConfirm) slotConfirm = false; else toTitle(); }
    else if (k === 'ok') {
      const d = readSlot(slotIdx);
      if (slotPurpose === 'continue') {
        if (!d) { sfx('bad'); return true; }
        sfx('ok'); hero = cleanHero(d.hero); curSlot = slotIdx; saveData = d; P.set = makeHeroSet(hero); stopSpeech();
        toVillage(d.fights > 0 ? 'ROKU: BACK, ' + hero.name + '? TRAIN FIRST.' : 'ROKU: TRAIN FIRST. I WAIT IN THE ARENA.');
      } else {
        if (d && !slotConfirm) { slotConfirm = true; sfx('warn'); return true; }
        sfx('ok'); curSlot = slotIdx; slotConfirm = false; cr = Object.assign({}, DEFAULT_HERO); crRow = 0; mode = 'creator';
      }
    }
    return true;
  }
  if (mode === 'creator') {
    if (k === 'up') { crRow = (crRow + 7) % 8; sfx('move'); }
    else if (k === 'down') { crRow = (crRow + 1) % 8; sfx('move'); }
    else if (k === 'back') { sfx('move'); mode = 'slots'; slotConfirm = false; }
    else if (k === 'left' || k === 'right') {
      const d = k === 'left' ? -1 : 1, wr = (v, n) => (v + d + n) % n;
      if (crRow === 1) cr.hair = wr(cr.hair, 4); else if (crRow === 2) cr.hairC = wr(cr.hairC, 6); else if (crRow === 3) cr.eyes = wr(cr.eyes, 6);
      else if (crRow === 4) cr.skin = wr(cr.skin, 5); else if (crRow === 5) cr.outfit = wr(cr.outfit, 6);
      if (crRow >= 1 && crRow <= 5) sfx('move');
    } else if (k === 'ok') {
      if (crRow === 0) { if (touchMode) askName(); if (cr.name) say(cr.name, { who: 'gytis' }); crRow = 1; sfx('ok'); }
      else if (crRow === 6) { cr.hair = (Math.random() * 4) | 0; cr.hairC = (Math.random() * 6) | 0; cr.eyes = (Math.random() * 6) | 0; cr.skin = (Math.random() * 5) | 0; cr.outfit = (Math.random() * 6) | 0; sfx('ok'); }
      else if (crRow === 7) {
        if (!cr.name) cr.name = 'KAI';
        hero = cleanHero(cr); saveData = { v: 1, hero, wins: 0, losses: 0, fights: 0, best: 0, savedAt: Date.now() }; writeSlot(curSlot, saveData);
        P.set = makeHeroSet(hero); sfx('ok'); newGame({ intro: true });
      } else { crRow++; sfx('move'); }
    }
    return true;
  }
  if (mode === 'options') {
    if (k === 'up') { optIdx = (optIdx + 3) % 4; sfx('move'); }
    else if (k === 'down') { optIdx = (optIdx + 1) % 4; sfx('move'); }
    else if (k === 'back') { toTitle(); }
    else if (k === 'ok' || k === 'left' || k === 'right') {
      if (optIdx === 0) { setMuted(!muted); if (!muted) sfx('ok'); }
      else if (optIdx === 1) setVoice(!voiceOn);
      else if (optIdx === 2) {
        const order = ['training', 'normal', 'master'], d = k === 'left' ? -1 : 1;
        difficulty = order[(order.indexOf(difficulty) + d + 3) % 3]; try { localStorage.setItem('yadra_diff', difficulty); } catch (e) {} sfx('move');
      } else if (k === 'ok') toTitle();
    }
    return true;
  }
  if (mode === 'credits') { if (k === 'ok' || k === 'back') { sfx('ok'); toTitle(); } return true; }
  return false;
}


// ================= touch controls for phones and tablets =================
const held = { up: false, down: false, left: false, right: false };
let touchMode = false;
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k && held[k] !== undefined) held[k] = false; });
addEventListener('blur', () => { for (const k in held) held[k] = false; });
(function setupTouch() {
  const isT = params.get('touch') === '1' || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
  if (!isT) return;
  touchMode = true; document.body.classList.add('touch'); fit();
  const pad = document.getElementById('pad');
  const DIRS4 = ['up', 'down', 'left', 'right'];
  let rep = null;
  pad.querySelectorAll('button').forEach(b => {
    const k = b.dataset.k;
    const down = e => {
      e.preventDefault(); initAudio(); b.classList.add('on');
      if (held[k] !== undefined) held[k] = true;
      press(k);
      if (DIRS4.indexOf(k) >= 0) { clearTimeout(rep); rep = setTimeout(function again() { press(k); rep = setTimeout(again, 120); }, 300); }
    };
    const up = e => { e.preventDefault(); b.classList.remove('on'); if (held[k] !== undefined) held[k] = false; clearTimeout(rep); };
    b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  document.addEventListener('contextmenu', e => e.preventDefault());
})();
function refreshTouchToggles() {
  const s = document.getElementById('btnSnd'), v = document.getElementById('btnVoice');
  if (s) s.classList.toggle('off', muted); if (v) v.classList.toggle('off', !voiceOn);
}
function askName() { // phones: the browser's own text box (the keyboard pops up)
  const v = window.prompt('NAME (MAX 8 LETTERS OR NUMBERS)', cr.name);
  if (v !== null) cr.name = String(v).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
}

refreshTouchToggles();
if (params.get('skipintro')) newGame({}); else toTitle();
window.__yadra = { get state() { return state; }, get mode() { return mode; }, press, doTurn, tgt, disp, get script() { return script; },
  get fish() { return vFish && { phase: vFish.phase, x: vFish.x, lo: vFish.lo, hi: vFish.hi, kind: vFish.kind }; },
  get pos() { return { x: vx, y: vy, area, fade: vFade }; }, tp(x, y, a) { if (a) area = a; vx = x; vy = y; }, people() { return curPeople().map(p => ({ n: p.name, x: p.x, y: p.y })); }, get foe() { return foe.id; } };
requestAnimationFrame(frame);
})();
